}


#warningMenu {
  position: absolute;
  top: 70px;
  left: 50px;
  background: rgba(20,24,29,0.9) !important;
  box-shadow: 0 10px 26px rgba(0,0,0,0.65) !important;
  color: white;
  padding: 5px;
  z-index: 2000;
  border-radius: 12px !important;
  border: 1px solid rgba(255,255,255,0.6) !important;
  font-family: Arial;
  font-size: 12px;
}

.header {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 8px 16px;
    font-family: Arial;
    border-radius: 8px;
}

#captureArea {
  width: 640px;
  height: 480px;
}

.image-container img.fifth {
    position: fixed;
    bottom: 10;
    right: 10;
    background-color: grey;
    box-shadow: 0 4px 12px rgba(0,0,0,1);
    border: none;
    border-radius: 8px;
    opacity: 100%;
    z-index: 10;
    }
    
    #warningBar {
  position: absolute;
  top: 0;
  left: 0;
  width: 640px;
  background: black;
  display: flex;
  align-items: center;
  padding: 5px 0px;
  z-index: 2000;
  font-family: lora;
}

/* Image */
#warningImage {
  width: 50px;
  height: 50px;
  object-fit: cover;
  margin-right: 10px;
  z-index: 2000;
}

/* Left text block */
.leftText {
  display: flex;
  flex-direction: column;
  z-index: 2000;
}

/* Right text block */
.rightText {
  margin-left: auto; /* pushes it to the right */
text-align: right;
margin-right: 5px;
z-index: 2000;
}

/* Text styles */
.yellowText {
  color: yellow;
  font-size: 21px;
  z-index: 2000;
}

.whiteText {
  color: white;
  font-size: 16px;
  z-index: 2000;
}

<script>

function getFormattedDateTime() {
  const now = new Date();

  const day = now.getDate();
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                      "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const month = monthNames[now.getMonth()];
  const year = now.getFullYear();
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri",
                      "Sat"];
  const dayofweek = dayNames[now.getDay()];

  let hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2, "0");

  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12;
  if (hours === 0) hours = 12;

  return `${dayofweek} ${day} ${month} ${year} ${hours}:${minutes} ${ampm}`;
}
</script>

function getCountyDirection(warningGeoJSON, county) {

    const countyFeature = turf.feature(
        county.geometry
    );

    const intersection = turf.intersect(
        turf.featureCollection([
            warningGeoJSON,
            countyFeature
        ])
    );

    if (!intersection) {
        return null;
    }

    // Determine how much of the county is inside the warning
    const countyArea = turf.area(countyFeature);
    const intersectionArea = turf.area(intersection);

    const coverage = intersectionArea / countyArea;

    // If 80% or more of the county is covered,
    // don't use a directional descriptor
    if (coverage >= 0.80) {
        return "";
    }

    const intersectionCenter = turf.centroid(intersection);
    const countyCenter = turf.centroid(countyFeature);

    const warningCoords =
        intersectionCenter.geometry.coordinates;

    const countyCoords =
        countyCenter.geometry.coordinates;

    const lonDifference =
        warningCoords[0] - countyCoords[0];

    const latDifference =
        warningCoords[1] - countyCoords[1];

    const threshold = 0.15;

    let northSouth = "";
    let eastWest = "";

    if (latDifference > threshold) {
        northSouth = "north";
    } else if (latDifference < -threshold) {
        northSouth = "south";
    }

    if (lonDifference > threshold) {
        eastWest = "east";
    } else if (lonDifference < -threshold) {
        eastWest = "west";
    }

   if (northSouth && eastWest) {
    const direction = `${northSouth}${eastWest}`;
    return direction.charAt(0).toUpperCase() + direction.slice(1) + "ern";
}

if (northSouth) {

}

if (eastWest) {

}

return "Central";
}

<script>
var nwsWarningsLayer = L.layerGroup();

function loadNWSWarnings() {

  fetch("https://api.weather.gov/alerts/active")
    .then(response => response.json())
    .then(data => {

      nwsWarningsLayer.clearLayers();

      L.geoJSON(data, {

style: function(feature) {
        let event = feature.properties.event;

        if (event.includes("Tornado")) {
          return { color: "#ff0000", weight: 2, fillOpacity: 0.3 };
        }
        if (event.includes("Severe Thunderstorm")) {
          return { color: "#ffff00", weight: 2, fillOpacity: 0.3 };
        }
        if (event.includes("Flood")) {
          return { color: "#00ff00", weight: 2, fillOpacity: 0.3 };
        }

        return { color: "#00ffff", weight: 2, fillOpacity: 0.2 };
      },

        onEachFeature: function(feature, layer) {
        layer.bindPopup(
          "<b>National Weather Service IRL</b><br>" +
          feature.properties.event + "<br>" +
          feature.properties.areaDesc
        );
      }

      }).addTo(nwsWarningsLayer);

    });

}

loadNWSWarnings();
</script>
