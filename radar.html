async function loadRadarTimes() {

    const capabilitiesURL = `https://opengeo.ncep.noaa.gov/geoserver/k${currentRadar}/ows?service=wms&version=1.3.0&request=GetCapabilities`;

    console.log("Loading radar times...");

    const response = await fetch(capabilitiesURL);
    const text = await response.text();

    const xml = new DOMParser().parseFromString(text, "text/xml");

    const dimension = xml.querySelector('Dimension[name="time"]');

    if (!dimension) {
        console.error("No time dimension found in WMS capabilities");
        return [];
    }

    const times = dimension.textContent
        .trim()
        .split(",");

    console.log("Loaded times:", times.length);

    return times;
}

async function initializeRadar() {

    frames = await loadRadarTimes();

    console.log("Radar initialized");

    slider.max = frames.length - 1;
    slider.value = frames.length - 1;

    showFrame(frames.length - 1);
}

function showFrame(index) {

    currentFrame = index;

    const time = frames[index];

    radarLayer.setParams({
         layers: `k${currentRadar}_${currentProduct}`,
         time: time
    });

    slider.value = index;
}

slider.oninput = () => {

    showFrame(Number(slider.value));

};

initializeRadar();

function playRadar() {

    if (isPlaying) return; // prevents duplicate loops

    isPlaying = true;

    playInterval = setInterval(() => {

        currentFrame++;

        if (currentFrame >= frames.length) {
            currentFrame = 0; // loop back
        }

        slider.value = currentFrame;
        showFrame(currentFrame);

    }, playbackSpeed);
}

function pauseRadar() {

    isPlaying = false;

    if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
    }
}

function togglePlay() {

    if (isPlaying) {
        pauseRadar();
    } else {
        playRadar();
    }
}

async function loadRadar(radar) {
console.log("entered loadradar " + radar);



    currentRadar = radar;

    frames = await loadRadarTimes(radar, currentProduct);

    slider.max = frames.length - 1;

    currentFrame = frames.length - 1;

    slider.value = currentFrame;

    showFrame(currentFrame);
    updateURL();

}

productSelect.addEventListener("change", async function () {

function updateURL() {

        "?" + params.toString()
    );

}

map.on("moveend", updateURL);

  })

});

map.hasLayer(citiesLayer)

// Show/hide markers on zoom
map.on("zoomend", function() {

  if (!map.hasLayer(citiesLayer)) return;

  var currentZoom = map.getZoom();

  citiesLayer.eachLayer(function(layer) {

    var city = fictoniaCities.find(c =>
      c.coords[0] === layer.getLatLng().lat &&
      c.coords[1] === layer.getLatLng().lng
    );

    if (currentZoom >= city.minZoom) {
      layer.getElement().style.display = "block";
    } else {
      layer.getElement().style.display = "none";
    }

  });

});
</script>

<script>
var nwsWarningsLayer = L.layerGroup({pane: 'layerPane'});

function loadNWSWarnings() {

  fetch("https://api.weather.gov/alerts/active")
    .then(response => response.json())
    .then(data => {

      nwsWarningsLayer.clearLayers();

      L.geoJSON(data, {

style: function(feature) {
        let event = feature.properties.event;

        if (event.includes("Tornado")) {
          return { color: "#ff0000", weight: 2, fillOpacity: 0.3, pane: 'layerPane' };
        }
        if (event.includes("Severe Thunderstorm")) {
          return { color: "#ffff00", weight: 2, fillOpacity: 0.3, pane: 'layerPane' };
        }
        if (event.includes("Flood")) {
          return { color: "#00ff00", weight: 2, fillOpacity: 0.3, pane: 'layerPane'  };
        }

        return { color: "#00ffff", weight: 2, fillOpacity: 0.2, pane: 'layerPane'  };
      },

        onEachFeature: function(feature, layer) {
        layer.bindPopup(
          "<b>National Weather Service IRL</b><br>" +
          feature.properties.event + "<br>" +
          feature.properties.areaDesc
        );
      }

      }).addTo(nwsWarningsLayer);

    });

}

loadNWSWarnings();

<script>

function buildWarningInfo(w) {

  let text = "<b style=background-color:" + getRadarColor(w.type) + ";>" + getWarningName(w.type) + "</b><br>";
  
  
    text += "Issued: " + w.issuedAt + "<br>";
  text += "Office: " + w.office + "<br>";

if (w.type === "MCD-SVR") {
    text += "<br><b>Mesoscale Discussion #" + w.mcdnumber + "</b><br>";
    text += "Watch Probability: " + w.probs;
  }
  
  if (w.type === "MCD-TOR") {
    text += "<br><b>Mesoscale Discussion #" + w.tormcdnumber + "</b><br>";
    text += "Watch Probability: " + w.torprobs;
  }

  // Severe-specific info
  if (w.type === "SVR") {
    text += "<br><b>Threats:</b><br>";
    text += "Wind: " + w.wind + " MPH<br>";
    text += "Hail: " + w.hail + " IN<br>";

    if (w.torPossible) {
      text += "Tornado: Possible<br>";
    }
  }
  
  if (w.type === "TOA") {
    if (w.toapds) {
      text += "<br><b>THIS IS A PARTICULARLY DANGEROUS SITUATION!</b><br>";
    }
  }
  
  // SPS-specific info
  if (w.type === "SPS") {
    text += "<br><b>Threats:</b><br>";
    text += "Wind: " + w.spswind + " MPH<br>";
    text += "Hail: " + w.spshail + " IN<br>";
  }
  
  if (w.type === "TOR") {
    text += "<br><b>Status:</b><br>";

    if (w.emergency) {
      text += "<b>TORNADO EMERGENCY</b><br>";
    } else if (w.pds) {
      text += "<b>Particularly Dangerous Situation</b><br>";
    }

    if (w.confirmed) {
      text += "Confirmed Tornado<br>";
    } else {
      text += "Radar Indicated<br>";
    }
  }
  if (w.type === "TOR-E") {
    text += "<br><b>Status:</b><br>";

    if (w.emergency) {
      text += "<b>TORNADO EMERGENCY</b><br>";
    } else if (w.pds) {
      text += "<b>Particularly Dangerous Situation</b><br>";
    }

    if (w.confirmed) {
      text += "Confirmed Tornado<br>";
    } else {
      text += "Radar Indicated<br>";
    }
  }
  
  if (w.type === "FFW") {
    text += "<b><br>Status:</b><br>";

    if (w.ffwemergency) {
      text += "<b>FLASH FLOOD EMERGENCY</b><br>";
    } else if (w.ffwconsiderable) {
      text += "<b>Flood Threat: Considerable</b><br>";
    }

    if (w.confirmed) {
      text += "Flash Flood: Confirmed<br>";
    } else {
      text += "Flash Flood: Radar Indicated<br>";
    }
        text += "Expected Rainfall Rate: " + w.ffwlowrate + "-" + w.ffwhighrate + " Inches In " + w.ffwrate + "<br>";
  }
  
  if (w.type === "FFW-E") {
    text += "<b><br>Status:</b><br>";

    if (w.ffwemergency) {
      text += "<b>FLASH FLOOD EMERGENCY</b><br>";
    } else if (w.ffwconsiderable) {
      text += "<b>Flood Threat: Considerable</b><br>";
    }

    if (w.confirmed) {
      text += "Flash Flood: Confirmed<br>";
    } else {
      text += "Flash Flood: Radar Indicated<br>";
    }
        text += "Expected Rainfall Rate: " + w.ffwlowrate + "-" + w.ffwhighrate + " Inches In " + w.ffwrate + "<br>";
  }
  

  text += "<br>Expires: " + w.expires + "<br>";
  
  text += "<br>Issued by: " + w.signature + "<br>";

console.log(text);

  return text;
}

function buildWarningMenuInfo(w) {

let text = `<button id="warningclosebutton" onclick="closeMenu()"> X </button></div>`

 text += "<b style=background-color:" + getRadarColor(w.type) + ";>" + getWarningName(w.type) + "</b><br>";
  text += w.warningtext + "<br>";


  return text;
}


function buildPopup(w) {
return buildWarningInfo(w) +
    `<br><button onclick="showDetails('${w}')">View Details</button>`;

<script>
db.ref("warnings").on("value", function(snapshot) {
  var data = snapshot.val();
  if (!data) return;

  drawnItems.clearLayers();
  drawnItems2.clearLayers();

  for (let key in data) {
    let w = data[key];

    if (Date.now() > w.expiresAt) {
  db.ref("warnings/" + key).remove();
  continue;
}

    let polygon = L.polygon(w.coords, {
    pane: 'boutlinePane',
      color: "black",
      weight: getWeight(w.type),
      dashArray: getDash(w.type),
       fill: false,
    });
    
    let polygon3 = L.polygon(w.coords, {
    pane: 'outlinePane',
      color: getRadarColor(w.type),
      weight: 3,
      dashArray: getDash(w.type),
       fill: false,
    });
    
    let polygon2 = L.polygon(w.coords, {
      pane: 'fillPane',
      color: getRadarColor(w.type),
      weight: 0,
      stroke: false,
      fillOpacity: 1
    });


    polygon2.bindPopup(buildPopup(w),
    {pane: 'popupPane'}
    );
    
    polygon2.on("click", function() {
    
    let warntext = buildWarningMenuInfo(w);
    
    document.getElementById("warningTextMenu").innerHTML = warntext;
    });
    
    
drawnItems.addLayer(polygon3);
    drawnItems.addLayer(polygon);
    drawnItems2.addLayer(polygon2);
    
  }
});
</script>
